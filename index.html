<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="喫茶店で消えた2つのケーキ。その行方を証拠から推理する日常ミステリーゲーム。">
  <title>消えた2つのケーキ</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <header class="topbar"><span class="brand">TEA ROOM BELL</span><button class="text-button" id="restart" type="button">最初から</button></header>
  <main class="layout">
    <aside class="sidebar" aria-label="ゲームの進行">
      <p class="side-label">CASE FILE 01</p><h1>消えた<br>2つのケーキ</h1>
      <ol class="progress" id="progress"></ol>
      <p class="side-note">一度読んだ情報は、ここからいつでも見返せます。</p>
    </aside>
    <section class="main-panel" aria-live="polite">
      <div class="chapter-meta"><span id="chapter-count"></span><span class="meta-dot">●</span><span>日常ミステリー</span></div>
      <div id="content"></div>
      <nav class="chapter-nav" id="navigation"></nav>
    </section>
    <aside class="evidence-drawer" aria-label="公開済み情報">
      <h2>公開済み情報</h2><p class="drawer-help">読んだ章を選ぶと、いつでも見返せます。</p><div id="archive"></div>
    </aside>
  </main>
</body>
</html>
